<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mood Playlist</title>
  <style>
    :root {
      --bg: #1a1424;
      --card: #810081;
      --text: #ffffff;
      --muted: #e8d4f0;
      --btn: #a4a4a4;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    .meta { color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; }
    .list { display: flex; flex-direction: column; gap: 10px; max-width: 720px; }
    .track {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--card);
      border-radius: 12px;
      padding: 12px 16px;
      min-height: 64px;
    }
    .info { min-width: 0; }
    .title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist {
      font-style: italic;
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 2px;
    }
    .actions a {
      display: inline-block;
      color: #fff;
      background: var(--btn);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      white-space: nowrap;
    }
    .actions a:hover {
      background: #c0c0c0;
      color: #111;
    }
    .spotify-save {
      display: inline-block;
      background: #1db954;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 18px;
      margin-bottom: 16px;
    }
    .spotify-save:hover { background: #1ed760; }
  </style>
</head>
<body>
  <h1><!--MOOD_LABEL--></h1>
  <p class="meta"><!--META--></p>
  <p><!--SPOTIFY--></p>
  <div class="list">
    <!--TRACKS-->
  </div>
</body>
</html>
