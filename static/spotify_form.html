<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save on Spotify</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      background: #1a1424;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    label {
      display: block;
      margin: 14px 0 6px;
    }
    input, textarea {
      width: min(420px, 100%);
      box-sizing: border-box;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font: inherit;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      margin-top: 14px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: #1db954;
      color: #fff;
      font-weight: 700;
    }
    a {
      color: #e8d4f0;
    }
    details {
      max-width: 420px;
      margin: 14px 0;
      padding: 12px;
      border: 1px solid #4a3f5c;
      border-radius: 8px;
    }
    summary {
      cursor: pointer;
      font-weight: 700;
    }
    code {
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a2136;
    }
    .error {
      color: #ff8a8a;
    }
  </style>
</head>
<body>
  <h1>Name your Spotify playlist</h1>
  <!--ERROR-->
  <details <!--SETUP_OPEN-->>
    <summary>One-time Spotify setup</summary>
    <ol>
      <li>Have Spotify Premium.<a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>.</li>
      <li>Create an app at <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a>.</li>
      <li>Add this Redirect URI: <code>http://127.0.0.1:8888/callback</code></li>
      <li>Paste the app's Client ID below.</li>
    </ol>
  </details>
  <form method="POST" action="/save">
    <label for="client_id">Spotify Client ID</label>
    <input id="client_id" name="client_id" type="text" maxlength="32" value="<!--CLIENT_ID-->" required />
    <label for="name">Playlist name</label>
    <input id="name" name="name" type="text" required autofocus />
    <label for="description">Description</label>
    <textarea id="description" name="description" required></textarea>
    <div><button type="submit">Continue to Spotify</button></div>
  </form>
  <p><a href="/">Back to playlist</a></p>
</body>
</html>
