<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kronkondile</title>
  <link rel="stylesheet" href="/static/index.css">
</head>
<body>
  <h1>Kronkondile</h1>

  <section id="feelings-panel">
    <pre id="feelings-prompt"></pre>
    <div id="feelings-buttons"></div>
  </section>

  <!-- Menu -->
  <section id="menu-panel" class="hidden">
    <h2 id="mood-label"></h2>
    <p>What would you like to do today?</p>
    <button onclick="quickMusic()">[1] Quick music recommendation</button>
    <button onclick="startDiscoverMusic()">[2] Discover music</button>
    <button onclick="alert('Wire book discover like music in app.py')">[3] Discover books</button>
  </section>

  <!-- Quick rec -->
  <section id="quick-panel" class="hidden">
    <h2>Quick recommendation</h2>
    <div id="quick-output"></div>
  </section>

  <!-- Discover music -->
  <section id="discover-panel" class="hidden">
    <h2>Discover music</h2>
    <p id="seed-list"></p>
    <div class="seed-picker">
      <label for="seed-select">Pick a starting artist</label>
      <select id="seed-select"></select>
      <button id="pick-seed-btn" type="button" onclick="pickSeed()">Start with this artist</button>
    </div>
    <hr />
    <div id="discover-current"></div>
    <button onclick="rate('l')">Like</button>
    <button onclick="rate('d')">Dislike</button>
    <button onclick="rate('u')">Unknown</button>
    <button onclick="quitDiscover()">Quit</button>
    <div id="discover-stats" class="discover-stats" aria-live="polite"></div>
  </section>

  <script>
    let moodIndex = null;
    let discoverSessionId = null;
    let currentArtist = null;

    const feelings_key = "kron_feeling";

    const feelings_labels = {    
    0 : "Lovesick / I feel unloved, like a kidney stone.",
    1 : "Average / You are that penguin heading towards the mountains, 70 kilometeres away.",
    2 : "Silly / You are going to talk to your dog about homosexuality and communism.",
    3 : "Happy / as happy as a minion around Gru.",
    4 : "I Love Everything! / Life is all rainbows and sunshine."};


    function today_str() {
      return new Date().toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric",
      }).replace(/ /g, "-");
    }

    function get_stored_feeling() {
      const raw = localStorage.getItem(feelings_key);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function logged_today_local() {
      const row = get_stored_feeling();
      return row && row.date === today_str();
    }

    function save_feeling_local(feel) {
      localStorage.setItem(feelings_key, JSON.stringify({
        feel: feel,
        date: today_str(),
        mood_label: feelings_labels[feel],
      }));
    }

    function show_menu(mood_label) {
      document.getElementById("mood-label").textContent = mood_label;
      document.getElementById("feelings-panel").classList.add("hidden");
      document.getElementById("menu-panel").classList.remove("hidden");
    }

    function require_mood() {
      if (moodIndex === null && logged_today_local()) {
        moodIndex = get_stored_feeling().feel;
      }
      if (moodIndex === null) {
        alert("Log how you feel today first.");
        return false;
      }
      return true;
    }

    function logFeeling(feel) {
      if (!(feel in feelings_labels)) return alert("Choose 0-4");
      save_feeling_local(feel);
      moodIndex = feel;
      show_menu(feelings_labels[feel]);
    }

    async function loadFeelingsState() {
    if (logged_today_local()) {
        const row = get_stored_feeling();
        moodIndex = row.feel;
        show_menu(row.mood_label);
        return;
    }

    const res = await fetch("/api/feeling/prompt");
    const data = await res.json();
    if (!data.ok) return alert(data.error || "Could not load feelings");

    document.getElementById("feelings-prompt").textContent = data.prompt;

    const box = document.getElementById("feelings-buttons");
    box.innerHTML = "";
    for (let i = 0; i <= 4; i++) {
        const btn = document.createElement("button");
        btn.textContent = String(i);
        btn.onclick = () => logFeeling(i);
        box.appendChild(btn);
    }
    }

    async function quickMusic() {
      if (!require_mood()) return;
      const res = await fetch("/api/quick/music", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mood_index: moodIndex }),
      });
      const data = await res.json();
      if (!data.ok) return alert(data.error || "Could not load music");
      document.getElementById("quick-panel").classList.remove("hidden");
      document.getElementById("quick-output").innerHTML =
        `<p>${data.title} — ${data.artist || ""}</p>
         <a href="${data.url}" target="_blank">Open on YouTube</a>`;
    }

    async function startDiscoverMusic() {
      if (!require_mood()) return;
      try {
      const seedsRes = await fetch(`/api/discover/music/seeds?mood_index=${moodIndex}`);
      const seedsData = await seedsRes.json();
      if (!seedsData.ok) return alert(seedsData.error || "Could not load seeds");
      const sel = document.getElementById("seed-select");
      sel.innerHTML = "";
      seedsData.seeds.forEach((a) => {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        sel.appendChild(opt);
      });
      document.getElementById("seed-list").textContent =
        "Artists for this mood: " + seedsData.seeds.join(", ");
      document.getElementById("discover-current").innerHTML = "";
      document.getElementById("discover-stats").innerHTML = "";
      discoverSessionId = null;
      currentArtist = null;
      document.getElementById("discover-panel").classList.remove("hidden");
      } catch (err) {
        alert("Discover failed: " + err);
      }
    }

    async function pickSeed() {
      if (!require_mood()) return;
      const seed = document.getElementById("seed-select").value;
      const res = await fetch("/api/discover/music/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ seed_artist: seed, mood_index: moodIndex }),
      });
      const data = await res.json();
      if (!data.ok) return alert(data.error);
      discoverSessionId = data.session_id;
      showArtist(data.current, data.track.url);
    }

    function showArtist(name, url) {
      currentArtist = name;
      document.getElementById("discover-current").innerHTML =
`<h3>${name}</h3><a href="${url}" target="_blank" rel="noopener">Artist profile here</a>`;    }

    function renderStats(stats) {
    const el = document.getElementById("discover-stats");
    if (!stats) {
        el.innerHTML = "";
        return;
    }
    el.innerHTML = `
        <div class="stat"><span class="stat-label">Likes</span><span class="stat-value">${stats.likes}</span></div>
        <div class="stat"><span class="stat-label">Dislikes</span><span class="stat-value">${stats.dislikes}</span></div>
        <div class="stat"><span class="stat-label">Seen</span><span class="stat-value">${stats.seen}</span></div>
    `;
    }

    async function rate(choice) {
      const res = await fetch("/api/discover/music/step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: discoverSessionId,
          current: currentArtist,
          choice,
        }),
      });
      const data = await res.json();
      if (data.done) {
        alert(data.message || "Session over");
        return;
      }
      showArtist(data.current, data.track.url);
      renderStats(data.stats);

    }

    async function quitDiscover() {
      const add = confirm("Add session likes to all-time favorites?");
      const res = await fetch("/api/discover/music/step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: discoverSessionId,
          current: currentArtist,
          choice: "q",
          add_favorites: add,
        }),
      });
      const data = await res.json();
      alert("Liked in this session: " + ((data.likes_session || []).join(", ") || "(none)"));
    }

    loadFeelingsState(); // skip feelings prompt if already logged today
  </script>
</body>
</html>
